<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лист відправлено</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .auth-card {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border: none;
        }
        .auth-header {
            background: linear-gradient(135deg, #4b6cb7, #182848);
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 1.5rem;
            text-align: center;
        }
        .auth-body {
            padding: 2rem;
            background: white;
            border-radius: 0 0 15px 15px;
            text-align: center;
        }
        .btn-primary {
            background-color: #4b6cb7;
            border: none;
            width: 100%;
            max-width: 250px;
            margin: 0 auto;
        }
        .email-icon {
            font-size: 4rem;
            color: #4b6cb7;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card auth-card">
                    <div class="auth-header">
                        <h2 class="mb-0">Лист відправлено</h2>
                    </div>
                    <div class="auth-body">
                        <i class="bi bi-envelope-check email-icon"></i>
                        <p class="lead">Ми надіслали вам інструкції для відновлення пароля на вказану email-адресу.</p>
                        <p>Якщо ви не отримали листа, перевірте папку "Спам" або спробуйте ще раз.</p>
                        <div class="mt-4">
                            <a href="{% url 'login' %}" class="btn btn-primary">
                                Повернутися до сторінки входу
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
